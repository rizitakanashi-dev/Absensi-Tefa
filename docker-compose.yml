version: '3.8'

services:
  # Database MySQL
  db:
    image: mysql:8.0
    container_name: absensi_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: absensi
      MYSQL_USER: absensi_user
      MYSQL_PASSWORD: absensipassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Backend .NET 8 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absensi_backend
    restart: always
    ports:
      - "5072:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=absensi;Uid=absensi_user;Pwd=absensipassword;SslMode=Disabled;AllowPublicKeyRetrieval=True;
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
