version: '3.8'

services:
  # Database MySQL
  db:
    image: mysql:8.0
    container_name: absensi_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: absensi_db
      MYSQL_USER: absensi_user
      MYSQL_PASSWORD: absensipassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Eksekusi setup.sql otomatis saat database baru dibuat
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql

  # Backend .NET 8 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absensi_backend
    restart: always
    ports:
      - "5072:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=absensi_db;Uid=absensi_user;Pwd=absensipassword;
    depends_on:
      - db

volumes:
  db_data:
